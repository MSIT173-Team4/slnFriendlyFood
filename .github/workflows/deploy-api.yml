name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "prjFriendlyFoodWebAPI/**"    # 只有後端有改才觸發

permissions:
  contents: read
  id-token: write                      # Workload Identity Federation 需要

env:
  PROJECT_ID: friendlyfood-prod
  REGION: asia-east1
  IMAGE: asia-east1-docker.pkg.dev/friendlyfood-prod/friendlyfood/api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker build -f prjFriendlyFoodWebAPI/Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Deploy
        run: |
          gcloud run deploy friendlyfood-api --image=$IMAGE --region=$REGION