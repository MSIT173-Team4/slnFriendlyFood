name: Deploy SmartBot to Cloud Run                           # ← 1. 名稱

on:
  push:
    branches: [main]
    paths:
      - "SmartBot.Api/**"                                     # ← 2. 監看的資料夾
      - ".github/workflows/deploy-smartbot.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-east1
  IMAGE: asia-east1-docker.pkg.dev/friendlyfood-prod/friendlyfood/smartbot:${{ github.sha }}   # ← 3. 映像檔名稱 smartbot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_SERVICE_ACCOUNT }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker build -f SmartBot.Api/Dockerfile -t $IMAGE .   # ← 4a. SmartBot 的 Dockerfile
          docker push $IMAGE

      - name: Deploy
        run: gcloud run deploy smartbot-api --image=$IMAGE --region=$REGION   # ← 4b. 部署到 smartbot-api